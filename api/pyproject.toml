[project]
name = "buy-build-score-api"
version = "0.1.0"
description = "Buy & Build Score API: ranks owner-operated SMBs as acquisition targets with evidence-backed scores."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.117",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx[http2]>=0.28",
    "selectolax>=0.3.27",
    "tldextract>=5.1",
    "phonenumbers>=8.13",
    "email-validator>=2.2",
    "dnspython>=2.7",
    "rapidfuzz>=3.10",
    "cachetools>=5.5",
    "pyyaml>=6.0",
    "google-genai>=1.0",
    "groq>=0.13",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "types-PyYAML",
    "types-cachetools",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["db: needs a real Postgres (DATABASE_URL / TEST_DATABASE_URL)"]
